# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/7900013-dotcom/meddata
# The only value you type is ANTHROPIC_API_KEY. Everything else is generated or derived.
services:
  - type: web
    name: meddata
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meddata-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_MASTER_KEY
        generateValue: true   # every stored file is encrypted with this; keep a copy from the Render dashboard
      - key: MPASS_MOCK_ACCESS_CODE
        generateValue: true   # doctors need this code on the stand-in MPass page; read it in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EXTRACTOR
        value: claude
      - key: MPASS_MODE
        value: mock
      - key: STORAGE_BACKEND
        value: db
      - key: EMAIL_TRANSPORT
        value: console
databases:
  - name: meddata-db
    plan: free
    databaseName: meddata
    user: meddata
